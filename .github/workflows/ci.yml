name: CI

# Closes P1-QA-1. Until now nothing ran tsc or the suite except a person
# remembering to, which meant every guarantee in the v1 hardening work rested on
# that memory.
on:
  push:
    branches: [master]
  pull_request:

# A new push to the same branch makes the previous run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      # Schedule and payroll dates resolve in America/New_York. The local-midnight
      # conversions only work in negative UTC offsets, so a suite that runs solely in
      # Ohio's zone passes while they are fully broken (P1-DATE-1, test T8). GitHub
      # runners are UTC, which is already a third zone — all three must be green.
      - name: Tests — America/New_York
        run: npx vitest run
        env:
          TZ: America/New_York

      - name: Tests — Europe/Berlin
        run: npx vitest run
        env:
          TZ: Europe/Berlin

      - name: Build
        run: npx vite build
